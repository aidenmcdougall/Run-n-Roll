services:
  db:
    image: postgis/postgis:16-3.4
    container_name: runnroll-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runnroll}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runnroll}
      POSTGRES_DB: ${POSTGRES_DB:-runnroll}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runnroll} -d ${POSTGRES_DB:-runnroll}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off tool: loads the OpenStreetMap extract into PostGIS.
  # Not started by `docker compose up`; run via `npm run osm:load`.
  osm2pgsql:
    profiles: ["tools"]
    build: ./docker/osm2pgsql
    image: runnroll-osm2pgsql
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-runnroll}
      PGPASSWORD: ${POSTGRES_PASSWORD:-runnroll}
      PGDATABASE: ${POSTGRES_DB:-runnroll}
    volumes:
      - ./data/raw/osm:/data:ro
      - ./backend/db/osm:/style:ro

volumes:
  pgdata:
